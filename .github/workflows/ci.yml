name: CI

# Full test matrix on the remote runner. Nothing here needs a Claude account: the unit tests run
# against temp HOMEs with synthetic transcripts, the extension smoke test mocks the vscode API, and
# the e2e harness drives the real bundled CLI + capture hook in an isolated store.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for all jobs — they only checkout and upload artifacts.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # builds core + cli + the extension bundle, then runs core unit tests + the extension smoke test.
      # Output is teed to a file and uploaded on failure, so failures are diagnosable straight from
      # the artifact (no log-viewer access needed).
      - run: npm test 2>&1 | tee test-output.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output.txt
      # end-to-end: real CLI + capture hook over an isolated temp HOME/workspace (dist already built).
      # Skipped on Windows: the harness isolates via $HOME, which node ignores there (USERPROFILE).
      - run: bash test/e2e.sh
        if: runner.os != 'Windows'

  jetbrains:
    name: build JetBrains plugin
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test buildPlugin --console=plain
        working-directory: packages/jetbrains
      - uses: actions/upload-artifact@v4
        with:
          name: claude-observatory-jetbrains
          path: packages/jetbrains/build/distributions/*.zip

  package:
    name: build release artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # release/: the CLI .tgz (npm i -g) + the .vsix (code --install-extension) — no publish, no account
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: claude-observatory-release
          path: release/

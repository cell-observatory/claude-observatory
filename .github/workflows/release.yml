name: Release

# Cut a release by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
# CI re-runs the full suite, builds the share artifacts, and attaches them to a GitHub Release —
# teammates install with `npm i -g ./claude-observatory-<ver>.tgz` and `code --install-extension *.vsix`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm publish --provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: bash test/e2e.sh
      - run: npm run release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew buildPlugin --console=plain
        working-directory: packages/jetbrains
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp release/claude-observatory.vsix "release/claude-observatory-vscode-${TAG}.vsix"
          cp packages/jetbrains/build/distributions/*.zip "release/claude-observatory-jetbrains-${TAG}.zip"
          gh release create "$TAG" \
            release/claude-observatory-*.tgz \
            "release/claude-observatory-vscode-${TAG}.vsix" \
            "release/claude-observatory-jetbrains-${TAG}.zip" \
            --title "Claude Observatory ${TAG}" \
            --generate-notes
      - name: Publish CLI to npm (provenance)
        # Runs only if an NPM_TOKEN is configured; `npm test` above (version:check + lockfile) already
        # gated this. Skips gracefully otherwise so the GitHub Release still succeeds.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (GitHub Release still created)."
            exit 0
          fi
          ( cd packages/cli && npm publish --provenance --access public )

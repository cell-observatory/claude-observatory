# Automated dependency + GitHub Actions updates. The `github-actions` ecosystem also converts
# tag-pinned `uses:` to commit SHAs over time (supply-chain hardening).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /packages/jetbrains
    schedule:
      interval: weekly
